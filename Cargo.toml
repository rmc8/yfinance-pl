[package]
name = "yfinance-pl"
version = "0.9.1"
edition = "2024"

[lib]
name = "yfinance_pl"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
yfinance-rs = { version = "0.9.1", features = ["dataframe"] }
paft = { version = "0.9.0", features = ["dataframe"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
polars = { version = "0.53", default-features = false, features = ["lazy", "temporal"] }
pyo3-polars = "0.26"
chrono = "0.4"
rust_decimal = "1.36"
